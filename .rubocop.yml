inherit_gem:
  rubocop-gp:
    - ./config/default.yml

Gp/OptArgParameters:
  Enabled: false

Style/SingleLineMethods:
  Exclude:
    - lib/active_dry_form/builder.rb

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Rails/Delegate:
  Enabled: false

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
